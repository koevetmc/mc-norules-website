<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="logo-svg" role="img" aria-label="No Rules Survival">
  <!-- 2026-11-09: circled-A seal on charcoal iron. Same spawn monument, not a grass cube. -->
  <defs>
    <radialGradient id="ironDisc" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2c2620"/>
      <stop offset="1" stop-color="#100e0c"/>
    </radialGradient>
    <filter id="emberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#ironDisc)" stroke="#3a342e" stroke-width="1.4"/>
  <circle class="a-ring" cx="32" cy="32" r="20.5" fill="none" stroke="#c43a22" stroke-width="3.4"/>
  <g class="ember-vein" fill="none" stroke="#e85d04" stroke-width="1.2" stroke-linecap="round" filter="url(#emberGlow)">
    <path d="M12 22 L18 28 L14 36"/>
    <path d="M50 20 L46 30 L52 40"/>
    <path d="M28 8 L32 14"/>
    <path d="M32 52 L36 58"/>
  </g>
  <path class="a-letter" d="M32 16.5 L22.2 47.5 M32 16.5 L41.8 47.5 M25.6 36.2 H38.4" fill="none" stroke="#ffba08" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="ember-vein" cx="32" cy="32" r="20.5" fill="none" stroke="#ffba08" stroke-width="0.7" opacity=".7"/>
</svg>
